# Fetches Google Places reviews into src/data/google-reviews-fetched.json and commits
# if the file changed. Cloudflare Pages rebuilds from the new commit (same as a normal push).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_MAPS_API_KEY — Places-capable key (often shared with other tooling)
#   GOOGLE_MAPS_SERVER_KEY — optional; use if GOOGLE_MAPS_API_KEY is HTTP-referrer restricted
#                            (referrer keys fail on GitHub-hosted runners). Prefer a second key with
#                            Application restrictions: None + API restrictions: Places API only.
#   In Google Cloud, enable billing and enable "Places API (New)" (script uses places.googleapis.com first).
# Optional:
#   GOOGLE_PLACE_ID — current Place ID (ChIJ…); avoids Find Place lookup
#   GOOGLE_PLACE_QUERY — text query if GOOGLE_PLACE_ID not set (default in script: "Anna Hileman Art Colorado")
#
# Scheduled runs only fire from the repo default branch.

name: Refresh Google reviews

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-google-reviews
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Prefer dedicated server key so referrer-restricted browser keys still work elsewhere.
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      GOOGLE_PLACE_QUERY: ${{ secrets.GOOGLE_PLACE_QUERY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Google Maps secrets
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Add GOOGLE_MAPS_API_KEY (or GOOGLE_MAPS_SERVER_KEY) under Actions secrets."
            exit 1
          fi
          echo "::notice::Use the same Maps Platform API key string as in Google Cloud (annahileman-website). If fetch fails, open the next step log: HTTP status + JSON explain billing vs key vs API enablement."
          if [ -z "$GOOGLE_PLACE_ID" ] && [ -z "$GOOGLE_PLACE_QUERY" ]; then
            echo "::warning::GOOGLE_PLACE_ID not set. Script falls back to default query \"Anna Hileman Art Colorado\". Set GOOGLE_PLACE_QUERY to override."
          fi
          if [ -n "$GOOGLE_PLACE_ID" ]; then
            echo "Using GOOGLE_PLACE_ID from secrets."
          elif [ -n "$GOOGLE_PLACE_QUERY" ]; then
            echo "Using GOOGLE_PLACE_QUERY from secrets."
          else
            echo "Using built-in query fallback in script."
          fi

      - name: Smoke-test Places API (New) — prints status + body (key masked by GitHub)
        run: |
          set -euo pipefail
          Q="${GOOGLE_PLACE_QUERY:-Anna Hileman Art Colorado}"
          BODY=$(jq -n --arg q "$Q" '{textQuery:$q, regionCode:"US"}')
          code=$(curl -sS -o /tmp/places-smoke.json -w "%{http_code}" \
            -X POST 'https://places.googleapis.com/v1/places:searchText' \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: ${GOOGLE_MAPS_API_KEY}" \
            -H 'X-Goog-FieldMask: places.id' \
            -d "$BODY")
          echo "---- places.googleapis.com/v1/places:searchText ----"
          echo "HTTP ${code}"
          head -c 6000 /tmp/places-smoke.json || true
          echo ""
          if [ "$code" != "200" ]; then
            if [ "$code" = "403" ] && grep -q 'API_KEY_SERVICE_BLOCKED' /tmp/places-smoke.json 2>/dev/null; then
              echo "::warning::API_KEY_SERVICE_BLOCKED: this key cannot call Places API (New) SearchText. Edit the key in Google Cloud → Credentials → API restrictions and ensure **Places API (New)** is allowed (or temporarily *Don't restrict key* to verify). The fetch step will still try **legacy** Places if your key allows it."
              exit 0
            fi
            echo "::error::Places API (New) returned HTTP ${code}. See JSON above (billing, invalid key, or API not enabled)."
            exit 1
          fi
          if jq -e '.error' /tmp/places-smoke.json >/dev/null 2>&1; then
            echo "::error::Places API (New) returned an error object:"
            cat /tmp/places-smoke.json
            exit 1
          fi

      - name: Fetch reviews from Google Places API
        run: npm run reviews:fetch

      - name: Verify build
        run: npm run build

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/google-reviews-fetched.json
          if git diff --cached --quiet; then
            echo "No changes to google-reviews-fetched.json"
            exit 0
          fi
          git commit -m "chore: refresh Google reviews from Places API"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
