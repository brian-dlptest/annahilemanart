# Fetches Google Places reviews into src/data/google-reviews-fetched.json and commits
# if the file changed. Cloudflare Pages rebuilds from the new commit (same as a normal push).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_MAPS_API_KEY — Places-capable key (often shared with other tooling)
#   GOOGLE_MAPS_SERVER_KEY — optional; use if GOOGLE_MAPS_API_KEY is HTTP-referrer restricted
#                            (referrer keys fail on GitHub-hosted runners). Prefer a second key with
#                            Application restrictions: None + API restrictions: Places API only.
#   In Google Cloud, enable billing and enable "Places API (New)" (script uses places.googleapis.com first).
# Optional:
#   GOOGLE_PLACE_ID — current Place ID (ChIJ…); avoids Find Place lookup
#   GOOGLE_PLACE_QUERY — text query if GOOGLE_PLACE_ID not set (default in script: "Anna Hileman Art Colorado")
#
# Scheduled runs only fire from the repo default branch.

name: Refresh Google reviews

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-google-reviews
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Prefer dedicated server key so referrer-restricted browser keys still work elsewhere.
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      GOOGLE_PLACE_QUERY: ${{ secrets.GOOGLE_PLACE_QUERY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Google Maps secrets
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Add GOOGLE_MAPS_API_KEY (or GOOGLE_MAPS_SERVER_KEY) under Actions secrets."
            exit 1
          fi
          echo "::notice::If Places fetch fails with REQUEST_DENIED, create GOOGLE_MAPS_SERVER_KEY: a Maps key with Application restrictions = None and API restrictions = Places API only. Referrer-restricted keys cannot call Places from GitHub runners."
          if [ -z "$GOOGLE_PLACE_ID" ] && [ -z "$GOOGLE_PLACE_QUERY" ]; then
            echo "::warning::GOOGLE_PLACE_ID not set. Script falls back to default query \"Anna Hileman Art Colorado\". Set GOOGLE_PLACE_QUERY to override."
          fi
          if [ -n "$GOOGLE_PLACE_ID" ]; then
            echo "Using GOOGLE_PLACE_ID from secrets."
          elif [ -n "$GOOGLE_PLACE_QUERY" ]; then
            echo "Using GOOGLE_PLACE_QUERY from secrets."
          else
            echo "Using built-in query fallback in script."
          fi

      - name: Fetch reviews from Google Places API
        run: npm run reviews:fetch

      - name: Verify build
        run: npm run build

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/google-reviews-fetched.json
          if git diff --cached --quiet; then
            echo "No changes to google-reviews-fetched.json"
            exit 0
          fi
          git commit -m "chore: refresh Google reviews from Places API"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
