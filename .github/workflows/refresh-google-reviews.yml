# Fetches Google Places reviews into src/data/google-reviews-fetched.json and commits
# if the file changed. Cloudflare Pages rebuilds from the new commit (same as a normal push).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_MAPS_API_KEY — Maps Platform key with Places API enabled
# Optional:
#   GOOGLE_PLACE_ID — current Place ID for the business (preferred, stable)
#   GOOGLE_PLACE_QUERY — fallback text query if place ID is not set (default in script: "Anna Hileman Art Colorado")
#
# Scheduled runs only fire from the repo default branch — merge this workflow into `main`
# even if commits target `staging` (see checkout ref below).

name: Refresh Google reviews

on:
  schedule:
    # Daily 06:15 UTC (~11pm previous day US Mountain, varies with DST)
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-google-reviews
  cancel-in-progress: false

env:
  # Use Node 24 runtime for JS-based actions (avoids Node 20 deprecation on the runner).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Google Maps secrets
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_QUERY: ${{ secrets.GOOGLE_PLACE_QUERY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::Add repository secret GOOGLE_MAPS_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$GOOGLE_PLACE_ID" ] && [ -z "$GOOGLE_PLACE_QUERY" ]; then
            echo "::warning::GOOGLE_PLACE_ID not set. Falling back to default query in script: 'Anna Hileman Art Colorado'. Set GOOGLE_PLACE_QUERY to override."
          fi
          if [ -n "$GOOGLE_PLACE_ID" ]; then
            echo "Using GOOGLE_PLACE_ID from secrets."
          elif [ -n "$GOOGLE_PLACE_QUERY" ]; then
            echo "Using GOOGLE_PLACE_QUERY from secrets."
          else
            echo "Using built-in query fallback in script."
          fi

      - name: Fetch reviews from Google Places API
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_QUERY: ${{ secrets.GOOGLE_PLACE_QUERY }}
        run: npm run reviews:fetch

      - name: Verify build
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/google-reviews-fetched.json
          if git diff --cached --quiet; then
            echo "No changes to google-reviews-fetched.json"
            exit 0
          fi
          git commit -m "chore: refresh Google reviews from Places API"
          git push
