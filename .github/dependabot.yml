version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@tailwindcss/vite"
        versions: [">= 4.3.0"]
      - dependency-name: "tailwindcss"
        versions: [">= 4.3.0"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
