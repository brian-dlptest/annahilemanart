version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 10
    ignore:
      # Majors need manual migration; PRs for them fail the Pages preview
      # build and spam failure emails. Handle majors deliberately instead.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      # @astrojs/check 0.9.x peer-depends on typescript ^5 || ^6; TS 7 PRs
      # can't install. Remove when @astrojs/check supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
